name: CI

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build
        run: echo "Building application..."

      - name: Create build artifact
        run: echo "This is my application build" > application.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: application-build
          path: application.txt

  test:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: application-build

      - name: Test artifact
        run: cat application.txt

      - name: Check secret
        run: |
          if [ -n "${{ secrets.DEMO_SECRET }}" ]; then
            echo "Secret is available"
          else
            echo "Secret is missing"
            exit 1
          fi

  deploy-dev:
    needs: test
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Deploy to DEV
        run: echo "Deploying application to DEV..."

  deploy-prod:
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy to PROD
        run: echo "Deploying application to PROD..."